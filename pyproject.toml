[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "raphael-reborn"
version = "0.1.0"
requires-python = ">=3.12"

[tool.setuptools]
py-modules = []

[project.optional-dependencies]
bot = [
    "discord.py>=2.3.0",
    "nats-py>=2.6.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
]
worker = [
    "nats-py>=2.6.0",
    "qdrant-client>=1.10.0",
    "sentence-transformers>=3.0.0",
    "groq>=0.13.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
]
api = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "mwclient>=0.10.1",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "qdrant-client>=1.10.0",
    "sentence-transformers>=3.0.0",
    "nats-py>=2.6.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.3.0",
]
