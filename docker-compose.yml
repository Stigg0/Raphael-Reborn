services:
  qdrant:
    image: docker.io/qdrant/qdrant:latest
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: "${QDRANT_API_KEY}"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  nats:
    image: docker.io/nats:2.10-alpine
    restart: unless-stopped
    command: ["--config", "/etc/nats/nats.conf"]
    volumes:
      - ./nats.conf:/etc/nats/nats.conf:ro,z
      - nats_data:/data
    ports:
      - "8222:8222"    # monitoring (internal only in prod — remove port if not needed)
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  bot:
    build:
      context: .
      dockerfile: docker/bot.Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NATS_URL: "nats://nats:4222"
    depends_on:
      nats:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NATS_URL: "nats://nats:4222"
      QDRANT_URL: "http://qdrant:6333"
      # OLLAMA_BASE_URL and EMBED_BASE_URL come from .env (pointing at LM Studio)
    depends_on:
      nats:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NATS_URL: "nats://nats:4222"
      QDRANT_URL: "http://qdrant:6333"
    ports:
      - "8080:8080"
    depends_on:
      nats:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./subtitles:/app/subtitles:z
      - page_cache:/app/data/pages
      - addon_cache:/app/data/addons

  ollama:
    image: docker.io/ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - local-llm

volumes:
  qdrant_data:
  nats_data:
  ollama_data:
  page_cache:
  addon_cache:
